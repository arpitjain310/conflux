[project]
name = "conflux"
version = "0.1.0"
description = "Consolidation pipeline: pull from mismatched sources, reconcile schemas, and merge into one queryable store with incremental sync, idempotent upserts, and last-write-wins conflict resolution."
requires-python = ">=3.11"
# No runtime dependencies — the engine is standard library only.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
conflux = "consolidate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consolidate"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
